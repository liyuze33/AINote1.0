<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课堂笔记 AI 助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      Babel.registerPreset('react-classic', {
        presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
      })
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
      const { useState, useRef } = React

      const STORAGE_KEY = 'classroom-notes-history'
      const readHistory = () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY)
          const parsed = raw ? JSON.parse(raw) : []
          return Array.isArray(parsed) ? parsed : []
        } catch (e) {
          return []
        }
      }
      const writeHistory = (records) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(records))
        } catch (e) {}
      }
      const formatTime = (iso) => {
        return new Date(iso).toLocaleString('zh-CN', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit',
        })
      }

      const apiConfig = { baseUrl: 'https://api.deepseek.com/v1', apiKey: 'sk-3fdfb19f5584431c924d3ca2e21d34e5', model: 'deepseek-chat' }

      const normalizeAIResult = (data, transcript) => {
        if (!data || typeof data !== 'object') return null
        const colors = [
          'bg-indigo-50 text-indigo-600 ring-indigo-100',
          'bg-sky-50 text-sky-600 ring-sky-100',
          'bg-emerald-50 text-emerald-600 ring-emerald-100',
          'bg-amber-50 text-amber-600 ring-amber-100',
        ]
        const tints = ['border-indigo-200 bg-indigo-50/70', 'border-sky-200 bg-sky-50/70', 'border-emerald-200 bg-emerald-50/70']
        const titleColors = ['text-indigo-700', 'text-sky-700', 'text-emerald-700']
        const notes = Array.isArray(data.notes) ? data.notes.filter((n) => n && n.title).map((n, i) => ({
          time: n.time || `${String(i * 5).padStart(2, '0')}:00 - ${String((i + 1) * 5).padStart(2, '0')}:00`,
          title: String(n.title).slice(0, 60),
          points: Array.isArray(n.points) && n.points.length ? n.points.map((p) => String(p)) : [String(n.title)],
        })) : []
        const points = Array.isArray(data.points) ? data.points.slice(0, 6).map((p, i) => ({
          no: String(i + 1).padStart(2, '0'),
          title: String((p && p.title) || '').slice(0, 60),
          desc: String((p && p.desc) || ''),
          color: colors[i % colors.length],
        })) : []
        const branches = data.mindMap && Array.isArray(data.mindMap.branches) ? data.mindMap.branches.slice(0, 5).map((b, i) => ({
          title: String((b && b.title) || `分支 ${i + 1}`),
          tint: tints[i % tints.length],
          titleColor: titleColors[i % titleColors.length],
          items: Array.isArray(b.items) ? b.items.map((x) => String(x).slice(0, 40)) : [],
        })) : []
        const quiz = Array.isArray(data.quiz) ? data.quiz.slice(0, 5).map((q) => {
          const options = Array.isArray(q.options) ? q.options.map((x) => String(x)) : []
          let answer = Number(q.answer)
          if (!Number.isInteger(answer) || answer < 0 || answer >= options.length) answer = 0
          return { question: String(q.question || ''), options, answer, explain: String(q.explain || '') }
        }).filter((q) => q.options.length >= 2) : []
        if (!notes.length || !points.length || !branches.length) return null
        return {
          title: String(data.title || '课堂录音笔记'),
          notes, points, quiz,
          mindMap: { root: String((data.mindMap && data.mindMap.root) || '课堂主题'), branches },
          transcript,
        }
      }

      const callAI = async (text, duration, config) => {
        if (!config.apiKey) throw new Error('尚未填写 API Key')
        const base = (config.baseUrl || '').replace(/\/+$/, '')
        const prompt = '你是课堂笔记助手。请根据提供的课堂录音转写文本，只输出一个 JSON 对象（不要 Markdown 代码块、不要解释），结构为：{"title":"不超过15字的课程标题","notes":[{"time":"00:00 - 05:00","title":"小标题","points":["要点1","要点2"]}],"points":[{"title":"核心结论","desc":"具体说明"}],"mindMap":{"root":"主题","branches":[{"title":"分支名","items":["条目1","条目2"]}]},"quiz":[{"question":"题目","options":["A项","B项","C项","D项"],"answer":0,"explain":"解析"}]}。要求：所有内容必须来自转写文本，不得编造未出现的事实；notes 3-5 段，points 4 条，branches 3 个，quiz 3 题；answer 为正确选项的下标（从 0 开始）。'
        const response = await fetch(`${base}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${config.apiKey}` },
          body: JSON.stringify({
            model: config.model,
            messages: [
              { role: 'system', content: prompt },
              { role: 'user', content: `课堂时长：${duration}\n\n转写文本：\n${text}` },
            ],
            temperature: 0.3,
          }),
        })
        if (!response.ok) {
          let detail = ''
          try { detail = ((await response.json()).error || {}).message || '' } catch (e) {}
          throw new Error(`API 请求失败（${response.status}）${detail ? '：' + detail : ''}`)
        }
        const payload = await response.json()
        const choice = payload.choices && payload.choices[0]
        const content = choice && choice.message && choice.message.content
        if (!content) throw new Error('API 未返回内容')
        const cleaned = String(content).replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '')
        return normalizeAIResult(JSON.parse(cleaned), text)
      }

      const buildNotesFromTranscript = (text, durationText) => {
        const clean = (text || '').replace(/\s+/g, ' ').trim()
        const sentences = clean.split(/(?<=[。！？!?；;])/).map((s) => s.trim()).filter((s) => s.length > 3)
        if (!sentences.length) return null

        const groupCount = Math.min(4, sentences.length)
        const perGroup = Math.ceil(sentences.length / groupCount)
        const totalMin = parseInt(durationText, 10) || Math.max(1, Math.ceil(clean.length / 200))
        const notes = []
        for (let g = 0; g < groupCount; g++) {
          const start = Math.round(totalMin * g / groupCount)
          const end = Math.round(totalMin * (g + 1) / groupCount)
          const part = sentences.slice(g * perGroup, (g + 1) * perGroup)
          if (!part.length) break
          const head = part[0]
          notes.push({
            time: `${String(start).padStart(2, '0')}:00 - ${String(end).padStart(2, '0')}:00`,
            title: head.slice(0, 24) + (head.length > 24 ? '…' : ''),
            points: part,
          })
        }

        const colors = [
          'bg-indigo-50 text-indigo-600 ring-indigo-100',
          'bg-sky-50 text-sky-600 ring-sky-100',
          'bg-emerald-50 text-emerald-600 ring-emerald-100',
          'bg-amber-50 text-amber-600 ring-amber-100',
        ]
        const longest = sentences.slice().sort((a, b) => b.length - a.length)
        const points = longest.slice(0, 4).map((sentence, i) => ({
          no: String(i + 1).padStart(2, '0'),
          title: sentence.slice(0, 30) + (sentence.length > 30 ? '…' : ''),
          desc: sentence,
          color: colors[i],
        }))

        const first = sentences[0]
        const third = Math.ceil(sentences.length / 3)
        const mindMap = {
          root: first.slice(0, 12) + (first.length > 12 ? '…' : ''),
          branches: [
            { title: '开头内容', tint: 'border-indigo-200 bg-indigo-50/70', titleColor: 'text-indigo-700', items: sentences.slice(0, third).map((s) => s.slice(0, 20)) },
            { title: '中间内容', tint: 'border-sky-200 bg-sky-50/70', titleColor: 'text-sky-700', items: sentences.slice(third, third * 2).map((s) => s.slice(0, 20)) },
            { title: '结尾内容', tint: 'border-emerald-200 bg-emerald-50/70', titleColor: 'text-emerald-700', items: sentences.slice(third * 2).map((s) => s.slice(0, 20)) },
          ],
        }

        const quiz = sentences.slice(0, 3).map((sentence, i) => {
          const words = sentence.split(/[，,、\s]+/).filter((w) => w.length >= 2)
          const key = words.sort((a, b) => b.length - a.length)[0] || sentence.slice(0, 4)
          const others = [...new Set(sentences.filter((s) => s !== sentence).join('').split(/[，,、\s]+/).filter((w) => w.length >= 2 && w !== key))]
          const options = [key, others[i * 3] || '示例', others[i * 3 + 1] || '概念', others[i * 3 + 2] || '方法']
          const order = options.map((text, idx) => ({ text, idx })).sort(() => Math.random() - 0.5)
          return {
            question: `根据录音内容填空：${sentence.replace(key, '____')}`,
            options: order.map((o) => o.text),
            answer: order.findIndex((o) => o.idx === 0),
            explain: `原句：${sentence}`,
          }
        })

        return { notes, points, mindMap, quiz, transcript: clean }
      }

      const TABS = [
        { id: 'notes', label: '详细笔记' },
        { id: 'points', label: '核心要点' },
        { id: 'mindmap', label: '思维导图' },
        { id: 'quiz', label: '课后小测' },
      ]

      const detailedNotes = [
        {
          time: '00:00 - 03:15',
          title: '课程引入：什么是机器学习',
          points: [
            '机器学习是人工智能的一个分支，让计算机从数据中自动学习规律，而无需显式地编写规则。',
            '常见应用：垃圾邮件识别、商品推荐、语音助手与图像识别。',
            '本节课聚焦「监督学习」，核心任务是分类与回归。',
          ],
        },
        {
          time: '03:15 - 12:40',
          title: '监督学习的基本流程',
          points: [
            '收集数据：确定特征（feature）与标签（label），并划分为训练集和测试集。',
            '选择模型：根据问题类型挑选合适的算法，如线性回归、决策树、支持向量机。',
            '训练与评估：用损失函数衡量误差，通过测试集检查模型的泛化能力。',
          ],
        },
        {
          time: '12:40 - 25:10',
          title: '分类与回归的区别',
          points: [
            '分类（Classification）：输出是离散的类别，例如「垃圾邮件 / 正常邮件」。',
            '回归（Regression）：输出是连续的数值，例如房屋价格、明日气温。',
            '注意：二者的评价指标不同，分类常用准确率，回归常用均方误差（MSE）。',
          ],
        },
        {
          time: '25:10 - 30:00',
          title: '课堂小结与课后任务',
          points: [
            '过拟合是常见陷阱：模型在训练集表现好，但在新数据上表现差。',
            '下节课预告：无监督学习与聚类算法。',
            '课后请完成小测，并复习本节出现的五个关键术语。',
          ],
        },
      ]

      const corePoints = [
        {
          no: '01',
          title: '监督学习 = 带标签的数据',
          desc: '训练数据中每条样本都有明确答案，模型学习的是「输入 → 输出」的映射关系。',
          color: 'bg-indigo-50 text-indigo-600 ring-indigo-100',
        },
        {
          no: '02',
          title: '分类输出类别，回归输出数值',
          desc: '判断是/否属于分类；预测具体数量属于回归。这是选择算法的第一步。',
          color: 'bg-sky-50 text-sky-600 ring-sky-100',
        },
        {
          no: '03',
          title: '训练集用来学，测试集用来考',
          desc: '两者必须分开，否则无法客观评价模型面对新数据的真实能力。',
          color: 'bg-emerald-50 text-emerald-600 ring-emerald-100',
        },
        {
          no: '04',
          title: '警惕过拟合',
          desc: '模型过于记忆训练样本的细节时，泛化能力会下降，需要通过正则化等手段缓解。',
          color: 'bg-amber-50 text-amber-600 ring-amber-100',
        },
      ]

      const mindMap = {
        root: '监督学习',
        branches: [
          {
            title: '分类问题',
            tint: 'border-indigo-200 bg-indigo-50/70',
            titleColor: 'text-indigo-700',
            items: ['垃圾邮件识别', '图像分类', '情感分析'],
          },
          {
            title: '回归问题',
            tint: 'border-sky-200 bg-sky-50/70',
            titleColor: 'text-sky-700',
            items: ['房价预测', '气温预测', '销量预估'],
          },
          {
            title: '通用流程',
            tint: 'border-emerald-200 bg-emerald-50/70',
            titleColor: 'text-emerald-700',
            items: ['收集与划分数据', '选择并训练模型', '测试集评估'],
          },
        ],
      }

      const quiz = [
        {
          question: '下列哪一项属于典型的「分类」问题？',
          options: ['预测房屋价格', '判断邮件是否为垃圾邮件', '预测明日气温', '估计用户消费金额'],
          answer: 1,
          explain: '分类的输出是离散类别，判断垃圾邮件是典型的二分类任务。',
        },
        {
          question: '为什么要单独留出测试集？',
          options: ['让训练速度更快', '减少数据量', '客观评估模型对新数据的泛化能力', '增加模型参数'],
          answer: 2,
          explain: '测试集不参与训练，用来检验模型是否真正学到了规律而非死记硬背。',
        },
        {
          question: '模型在训练集上表现极好、在新数据上表现很差，最可能是？',
          options: ['欠拟合', '过拟合', '数据缺失', '学习率过低'],
          answer: 1,
          explain: '这是过拟合的典型表现，可通过正则化、更多数据或简化模型来缓解。',
        },
      ]

      function MicIcon({ className = 'w-7 h-7' }) {
        return (
          <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10a7 7 0 0 0 14 0" />
            <path d="M12 17v5M8 22h8" />
          </svg>
        )
      }

      function StopIcon({ className = 'w-7 h-7' }) {
        return (
          <svg className={className} viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        )
      }

      function HomeView({ listening, onToggle, onShowHistory, historyCount, transcript, error, elapsed, generating }) {
        return (
          <main className="min-h-screen bg-gradient-to-b from-slate-50 to-indigo-50 flex flex-col items-center justify-center px-6 text-center">
            <div className="mb-10 inline-flex items-center gap-2 rounded-full border border-indigo-100 bg-white px-4 py-1.5 text-sm font-medium text-indigo-600 shadow-sm">
              <span className="h-2 w-2 rounded-full bg-indigo-500" />
              课堂笔记 AI 助手
            </div>

            <h1 className="max-w-2xl text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl">
              认真听课，笔记交给我
            </h1>
            <p className="mt-5 max-w-xl text-base leading-7 text-slate-500">
              点击开始，实时记录课堂内容。下课后自动生成详细笔记、核心要点、思维导图与课后小测。
            </p>

            <button
              type="button"
              onClick={onToggle}
              disabled={generating}
              className={`group mt-12 inline-flex items-center gap-4 rounded-full px-10 py-5 text-lg font-semibold text-white shadow-xl transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70 ${
                generating
                  ? 'bg-slate-500'
                  : listening
                    ? 'bg-rose-500 shadow-rose-500/30 hover:bg-rose-600 focus:ring-rose-200'
                    : 'bg-indigo-600 shadow-indigo-600/30 hover:-translate-y-1 hover:bg-indigo-700 focus:ring-indigo-200'
              }`}
            >
              {generating ? (
                <span className="h-6 w-6 animate-spin rounded-full border-2 border-white/40 border-t-white" />
              ) : listening ? (
                <span className="relative flex h-7 w-7 items-center justify-center">
                  <span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-white opacity-40" />
                  <StopIcon />
                </span>
              ) : (
                <MicIcon />
              )}
              <span>{generating ? 'AI 正在生成笔记…' : listening ? '停止听课' : '开始听课'}</span>
            </button>

            <p className="mt-6 h-6 text-sm text-slate-500">
              {generating
                ? '正在调用 AI 整理笔记，请稍候…'
                : listening
                  ? `正在聆听… ${elapsed} 秒，再次点击结束并生成笔记`
                  : '点击开始后请允许麦克风权限，内容会实时转写'}
            </p>

            {listening && transcript && (
              <div className="mt-6 w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-5 text-left shadow-sm">
                <p className="text-xs font-medium text-slate-400">实时转写</p>
                <p className="mt-2 max-h-40 overflow-y-auto text-sm leading-6 text-slate-700">{transcript}</p>
              </div>
            )}

            {error && <p className="mt-4 max-w-xl text-sm leading-6 text-rose-500">{error}</p>}

            <div className="mt-8 flex flex-wrap items-center justify-center gap-3">
              <button
                type="button"
                onClick={onShowHistory}
                className="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/80 px-5 py-2.5 text-sm font-medium text-slate-600 shadow-sm transition hover:border-indigo-200 hover:text-indigo-600"
              >
                <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 2" />
                </svg>
                查看历史记录（{historyCount}）
              </button>
            </div>
          </main>
        )
      }

      function ResultView({ record, onBack, onShowHistory, backLabel, error }) {
        const detailedNotes = record.data.notes
        const corePoints = record.data.points
        const mindMap = record.data.mindMap
        const quiz = record.data.quiz
        const [activeTab, setActiveTab] = useState('notes')
        const [answers, setAnswers] = useState({})

        return (
          <div className="min-h-screen bg-slate-50">
            <header className="border-b border-slate-200 bg-white">
              <div className="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
                <button
                  type="button"
                  onClick={onBack}
                  className="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
                >
                  <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                  </svg>
                  {backLabel}
                </button>
                <div className="flex items-center gap-3">
                  <span className="text-sm text-slate-400">{formatTime(record.createdAt)} · {record.duration}</span>
                  <button
                    type="button"
                    onClick={onShowHistory}
                    className="rounded-lg px-3 py-2 text-sm font-medium text-indigo-600 transition hover:bg-indigo-50"
                  >
                    历史记录
                  </button>
                </div>
              </div>
            </header>

            <main className="mx-auto max-w-5xl px-6 py-10">
              {error && (
                <div className="mb-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm leading-6 text-rose-700">{error}</div>
              )}
              <div className="mb-8">
                <p className="text-sm font-medium text-indigo-600">
                  {record.source === 'AI API'
                    ? '已由 AI 根据录音内容生成'
                    : record.source === '录音转写'
                      ? '已根据本次录音内容生成'
                      : '演示数据（未获取到录音内容）'}
                </p>
                <h1 className="mt-2 text-3xl font-bold tracking-tight text-slate-900">{record.title}</h1>
                <p className="mt-2 text-sm text-slate-500">以下内容基于课堂录音整理，供复习参考。</p>
                {record.transcript && (
                  <div className="mt-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <p className="text-xs font-medium text-slate-400">录音转写原文</p>
                    <p className="mt-2 text-sm leading-7 text-slate-700">{record.transcript}</p>
                  </div>
                )}
              </div>

              <div className="mb-6 flex gap-2 overflow-x-auto border-b border-slate-200">
                {TABS.map((tab) => (
                  <button
                    key={tab.id}
                    type="button"
                    onClick={() => setActiveTab(tab.id)}
                    className={`relative shrink-0 px-5 py-3 text-sm font-medium transition-colors ${
                      activeTab === tab.id
                        ? 'text-indigo-600'
                        : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    {tab.label}
                    {activeTab === tab.id && (
                      <span className="absolute inset-x-3 -bottom-px h-0.5 rounded-full bg-indigo-600" />
                    )}
                  </button>
                ))}
              </div>

              {activeTab === 'notes' && (
                <section className="space-y-4">
                  {detailedNotes.map((note) => (
                    <article key={note.time} className="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                      <div className="mb-3 flex items-center gap-3">
                        <span className="rounded-md bg-indigo-50 px-2.5 py-1 text-xs font-semibold text-indigo-600">
                          {note.time}
                        </span>
                        <h2 className="text-lg font-semibold text-slate-900">{note.title}</h2>
                      </div>
                      <ul className="space-y-2.5">
                        {note.points.map((point) => (
                          <li key={point} className="flex gap-3 text-sm leading-6 text-slate-600">
                            <span className="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-indigo-400" />
                            <span>{point}</span>
                          </li>
                        ))}
                      </ul>
                    </article>
                  ))}
                </section>
              )}

              {activeTab === 'points' && (
                <section className="grid gap-4 sm:grid-cols-2">
                  {corePoints.map((item) => (
                    <article key={item.no} className="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                      <span className={`inline-flex rounded-lg px-2.5 py-1 text-xs font-bold ring-1 ${item.color}`}>
                        {item.no}
                      </span>
                      <h2 className="mt-4 text-base font-semibold text-slate-900">{item.title}</h2>
                      <p className="mt-2 text-sm leading-6 text-slate-600">{item.desc}</p>
                    </article>
                  ))}
                </section>
              )}

              {activeTab === 'mindmap' && (
                <section className="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
                  <div className="flex flex-col items-center">
                    <div className="rounded-xl bg-indigo-600 px-8 py-3 text-base font-semibold text-white shadow-lg shadow-indigo-500/20">
                      {mindMap.root}
                    </div>
                    <div className="h-8 w-px bg-slate-300" />
                    <div className="grid w-full gap-5 md:grid-cols-3">
                      {mindMap.branches.map((branch) => (
                        <div key={branch.title} className="relative rounded-xl border p-5">
                          <span className="absolute -top-2 left-1/2 h-4 w-px -translate-x-1/2 bg-slate-300" />
                          <h2 className={`mb-3 text-sm font-semibold ${branch.titleColor}`}>
                            {branch.title}
                          </h2>
                          <ul className="space-y-2">
                            {branch.items.map((item) => (
                              <li key={item} className="rounded-lg bg-slate-50 px-3 py-2 text-xs text-slate-600">
                                {item}
                              </li>
                            ))}
                          </ul>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>
              )}

              {activeTab === 'quiz' && (
                <section className="space-y-4">
                  {quiz.map((item, index) => {
                    const selected = answers[index]
                    return (
                      <article key={item.question} className="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                        <h2 className="text-base font-semibold leading-6 text-slate-900">
                          {index + 1}. {item.question}
                        </h2>
                        <div className="mt-4 grid gap-2 sm:grid-cols-2">
                          {item.options.map((option, optionIndex) => {
                            const isSelected = selected === optionIndex
                            const isCorrect = selected !== undefined && optionIndex === item.answer
                            return (
                              <button
                                key={option}
                                type="button"
                                onClick={() => setAnswers((prev) => ({ ...prev, [index]: optionIndex }))}
                                className={`rounded-xl border px-4 py-3 text-left text-sm transition ${
                                  isCorrect
                                    ? 'border-emerald-400 bg-emerald-50 text-emerald-700'
                                    : isSelected
                                      ? 'border-rose-400 bg-rose-50 text-rose-700'
                                      : 'border-slate-200 text-slate-600 hover:border-indigo-300 hover:bg-indigo-50/50'
                                }`}
                              >
                                {String.fromCharCode(65 + optionIndex)}. {option}
                              </button>
                            )
                          })}
                        </div>
                        {selected !== undefined && (
                          <p className={`mt-4 text-sm leading-6 ${
                            selected === item.answer ? 'text-emerald-600' : 'text-rose-600'
                          }`}>
                            {selected === item.answer ? '回答正确！' : `正确答案是 ${String.fromCharCode(65 + item.answer)}。`}
                            {' '}{item.explain}
                          </p>
                        )}
                      </article>
                    )
                  })}
                </section>
              )}
            </main>
          </div>
        )
      }

      function HistoryView({ records, onOpen, onBack, onDelete }) {
        return (
          <div className="min-h-screen bg-slate-50">
            <header className="border-b border-slate-200 bg-white">
              <div className="mx-auto flex max-w-3xl items-center justify-between px-6 py-4">
                <button
                  type="button"
                  onClick={onBack}
                  className="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
                >
                  <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                  </svg>
                  返回首页
                </button>
                <span className="text-sm text-slate-400">共 {records.length} 条记录</span>
              </div>
            </header>

            <main className="mx-auto max-w-3xl px-6 py-10">
              <h1 className="text-3xl font-bold tracking-tight text-slate-900">历史记录</h1>
              <p className="mt-2 text-sm text-slate-500">笔记保存在本机浏览器中，刷新或关闭页面后仍可查看。</p>

              {records.length === 0 ? (
                <div className="mt-10 rounded-2xl border border-dashed border-slate-300 bg-white p-12 text-center">
                  <div className="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 text-slate-400">
                    <svg className="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M4 6h16M4 12h16M4 18h10" />
                    </svg>
                  </div>
                  <p className="mt-4 text-sm text-slate-500">还没有历史记录，先去听一节课吧。</p>
                  <button
                    type="button"
                    onClick={onBack}
                    className="mt-5 rounded-full bg-indigo-600 px-6 py-2.5 text-sm font-medium text-white transition hover:bg-indigo-700"
                  >
                    返回首页
                  </button>
                </div>
              ) : (
                <ul className="mt-8 space-y-3">
                  {records.map((record) => (
                    <li key={record.id} className="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:border-indigo-200">
                      <button type="button" onClick={() => onOpen(record)} className="flex min-w-0 flex-1 items-center gap-4 text-left">
                        <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-indigo-50 text-indigo-600">
                          <svg className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <path d="M14 2v6h6M8 13h8M8 17h5" />
                          </svg>
                        </span>
                        <span className="min-w-0">
                          <span className="block truncate text-base font-semibold text-slate-900">{record.title}</span>
                          <span className="mt-1 block text-xs text-slate-500">{formatTime(record.createdAt)} · {record.duration} · {record.source || '演示数据'} · 4 个板块</span>
                        </span>
                      </button>
                      <button
                        type="button"
                        onClick={() => onDelete(record.id)}
                        className="shrink-0 rounded-lg px-3 py-2 text-sm text-slate-400 transition hover:bg-rose-50 hover:text-rose-600"
                      >
                        删除
                      </button>
                    </li>
                  ))}
                </ul>
              )}
            </main>
          </div>
        )
      }

      function App() {
        const [view, setView] = useState('home')
        const [listening, setListening] = useState(false)
        const [history, setHistory] = useState(readHistory)
        const [currentRecord, setCurrentRecord] = useState(null)
        const [resultOrigin, setResultOrigin] = useState('home')
        const [transcript, setTranscript] = useState('')
        const [error, setError] = useState('')
        const [elapsed, setElapsed] = useState(0)
        const [generating, setGenerating] = useState(false)
        const recognitionRef = useRef(null)
        const transcriptRef = useRef('')
        const startTimeRef = useRef(0)
        const timerRef = useRef(null)

        const persist = (records) => {
          setHistory(records)
          writeHistory(records)
        }

        const startListening = () => {
          setError('')
          setTranscript('')
          transcriptRef.current = ''
          setElapsed(0)
          startTimeRef.current = Date.now()
          timerRef.current = setInterval(() => {
            setElapsed(Math.floor((Date.now() - startTimeRef.current) / 1000))
          }, 1000)

          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
          if (!SpeechRecognition) {
            setError('当前浏览器不支持语音识别，本次将使用演示数据。')
            setListening(true)
            return
          }
          try {
            const recognition = new SpeechRecognition()
            recognition.lang = 'zh-CN'
            recognition.continuous = true
            recognition.interimResults = true
            recognition.onresult = (event) => {
              let text = ''
              for (let i = 0; i < event.results.length; i++) {
                text += event.results[i][0].transcript
              }
              transcriptRef.current = text
              setTranscript(text)
            }
            recognition.onerror = (event) => {
              setError('语音识别失败：' + event.error + '。请允许麦克风权限并保持联网。')
            }
            recognition.start()
            recognitionRef.current = recognition
          } catch (e) {
            setError('无法启动语音识别：' + e.message)
          }
          setListening(true)
        }

        const stopListening = async () => {
          if (recognitionRef.current) {
            try { recognitionRef.current.stop() } catch (e) {}
            recognitionRef.current = null
          }
          if (timerRef.current) {
            clearInterval(timerRef.current)
            timerRef.current = null
          }
          const seconds = Math.max(1, Math.floor((Date.now() - startTimeRef.current) / 1000))
          const duration = `${Math.max(1, Math.round(seconds / 60))} 分钟`
          const text = transcriptRef.current.trim()
          let generated = text ? buildNotesFromTranscript(text, duration) : null
          let source = generated ? '录音转写' : '演示数据'
          let title = generated ? '课堂录音笔记' : '《机器学习导论》课堂笔记'

          if (text && apiConfig.apiKey) {
            setGenerating(true)
            setError('')
            try {
              const ai = await callAI(text, duration, apiConfig)
              if (ai) {
                generated = ai
                source = 'AI API'
                title = ai.title
              }
            } catch (e) {
              setError('AI 接口调用失败，已改用本地整理：' + e.message)
            }
            setGenerating(false)
          }

          const record = {
            id: Date.now(),
            createdAt: new Date().toISOString(),
            title,
            duration,
            source,
            transcript: text,
            data: generated
              ? { notes: generated.notes, points: generated.points, mindMap: generated.mindMap, quiz: generated.quiz }
              : { notes: detailedNotes, points: corePoints, mindMap, quiz },
          }
          persist([record, ...history])
          setCurrentRecord(record)
          setResultOrigin('home')
          setListening(false)
          setTranscript('')
          setView('result')
        }

        const toggleListening = () => (listening ? stopListening() : startListening())

        const openRecord = (record) => {
          setCurrentRecord(record)
          setResultOrigin('history')
          setView('result')
        }

        if (view === 'history') {
          return (
            <HistoryView
              records={history}
              onOpen={openRecord}
              onBack={() => setView('home')}
              onDelete={(id) => persist(history.filter((record) => record.id !== id))}
            />
          )
        }

        if (view === 'result' && currentRecord) {
          return (
            <ResultView
              record={currentRecord}
              backLabel={resultOrigin === 'history' ? '返回历史记录' : '返回首页'}
              onBack={() => setView(resultOrigin)}
              onShowHistory={() => setView('history')}
              error={error}
            />
          )
        }

        return (
          <HomeView
            listening={listening}
            onToggle={toggleListening}
            onShowHistory={() => setView('history')}
            historyCount={history.length}
            transcript={transcript}
            error={error}
            elapsed={elapsed}
            generating={generating}
          />
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
